<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Interlock — it can fix it. May it?">
  <defs>
    <linearGradient id="il-bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0c0f16"/><stop offset="1" stop-color="#151a25"/>
    </linearGradient>
    <linearGradient id="il-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#il-bg)"/>

  <!-- wordmark -->
  <text x="88" y="106" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace"
        font-size="34" font-weight="bold" letter-spacing="6" fill="#f8fafc">INTERLOCK</text>
  <rect x="90" y="122" width="140" height="4" rx="2" fill="url(#il-accent)"/>

  <!-- the thesis -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-2">
    <text x="86" y="248" font-size="70" fill="#6b7788">It can fix it.</text>
    <text x="86" y="332" font-size="70" fill="#f8fafc">May it?</text>
  </g>

  <!-- the answer, which is the policy -->
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="25">
    <text x="88" y="420" fill="#98a3b4">a missing dependency</text>
    <line x1="402" y1="413" x2="1122" y2="413" stroke="#2b3341" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <text x="1192" y="420" text-anchor="end" font-weight="bold" fill="#34d399">yes</text>

    <text x="88" y="476" fill="#98a3b4">a deprecated build step</text>
    <line x1="442" y1="469" x2="1012" y2="469" stroke="#2b3341" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <text x="1192" y="476" text-anchor="end" font-weight="bold" fill="#fbbf24">ask a human</text>

    <text x="88" y="532" fill="#98a3b4">your deploy pipeline</text>
    <line x1="402" y1="525" x2="970" y2="525" stroke="#2b3341" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <text x="1192" y="532" text-anchor="end" font-weight="bold" fill="#f87171">absolutely not</text>
  </g>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="17">
    <text x="88" y="594" fill="#34d399">say yes once and it stops asking</text>
    <text x="1192" y="594" text-anchor="end" fill="#4a5462">zero dependencies · MIT</text>
  </g>
</svg>
